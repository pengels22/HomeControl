<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeControl PNL Preview</title>
<style>
:root{color-scheme:dark;--bg:#0b1115;--panel:#172125;--line:#426057;--text:#eef7f2;--muted:#a8bbb3;--accent:#9defd6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05090b;color:var(--text);font-family:system-ui,sans-serif}.panel{width:min(1024px,100vw);height:min(600px,100vh);display:grid;grid-template-rows:64px 1fr 34px;gap:10px;padding:14px;background:var(--bg)}header{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;border-bottom:1px solid var(--line)}header h1{text-align:center;font-size:1.35rem;margin:0}header span{color:var(--muted);font-size:.85rem}header .status{text-align:right}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:stretch}.card{display:flex;flex-direction:column;justify-content:space-between;min-height:120px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.card h2{margin:0;font-size:1rem}.value{font-size:2rem;color:var(--accent)}button{padding:10px 14px;border:1px solid var(--line);border-radius:7px;background:#25453d;color:var(--text);cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.muted{color:var(--muted)}footer{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem}@media(max-width:700px){.panel{height:100vh}.cards{grid-template-columns:repeat(2,1fr);overflow:auto}header{grid-template-columns:1fr 1fr 1fr}}
</style></head><body><main class="panel" aria-label="PNL full width preview"><header><span id="connection">● HCM connected</span><h1 id="room">Living Room</h1><span class="status" id="mic">Microphone muted</span></header><section class="cards" id="cards"></section><footer><span>1024 × 600 native layout · Preview only</span><span id="revision"></span></footer></main>
<script>
const cards=[['Temperature','21.5 °C'],['Humidity','43 %'],['Illuminance','340 lux'],['Occupancy','Occupied'],['Main Light','ON'],['Thermostat','21 °C · HEAT']];
function draw(){document.getElementById('cards').innerHTML=cards.map(([name,value],i)=>`<article class="card"><h2>${name}</h2><span class="value">${value}</span>${i===4?'<button disabled>Preview action</button>':''}</article>`).join('');document.getElementById('revision').textContent='Last-good layout · simulator fixture'}draw();
</script></body></html>
