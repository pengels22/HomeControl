<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeControl Panel</title>
<style>body{font-family:system-ui;margin:2rem;background:#111;color:#eee}button,input,select{font-size:1.1rem;padding:.7rem;margin:.25rem}.card{border:1px solid #444;border-radius:12px;padding:1rem;max-width:520px}</style></head>
<body><div class="card"><h1>HomeControl</h1><p>First-pass panel client. Production kiosk UI will replace this page.</p>
<label>Mode <select id="mode"><option>OFF</option><option>HEAT</option><option>COOL</option><option>FAN</option></select></label>
<label>Setpoint <input id="sp" type="number" min="45" max="90" value="70"></label>
<button id="apply">Apply HVAC</button><pre id="out"></pre></div>
<script>
const out=document.getElementById('out');let token='';
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch('/api/v1'+path,opt);const j=await r.json();if(!r.ok)throw new Error(JSON.stringify(j));return j}
(async()=>{try{token=(await api('/auth/dev-session',{method:'POST'})).token;const h=await api('/hvac');mode.value=h.mode;sp.value=h.setpoint_f;out.textContent=JSON.stringify(h,null,2)}catch(e){out.textContent=e}})();
apply.onclick=async()=>{try{await api('/hvac/mode',{method:'PUT',body:JSON.stringify({mode:mode.value})});await api('/hvac/setpoint',{method:'PUT',body:JSON.stringify({setpoint_f:+sp.value})});out.textContent=JSON.stringify(await api('/hvac'),null,2)}catch(e){out.textContent=e}};
</script></body></html>
