schema_version: 1
device_type: CONFLICT
package: 07_CONFLICT
hardware:
  # Keep the legacy inventory token for deployment-plan compatibility while
  # documenting the verified current hardware as Orange Pi/Armbian.
  supported_platforms: [raspberry_pi, orange_pi_zero_2w]
  supported_os: [debian, armbian]
  architectures: [aarch64]
runtime:
  type: python
  python: ">=3.11"
deployment:
  adapter: conflict_heartbeat
  install: install.sh
  update: update.sh
  verify: verify.sh
  rollback: rollback.sh
  actions: [install, update, verify, rollback]
services:
  - hcm-heartbeat.service
configuration_files:
  - manifest.yaml
  - hardware_pins.yaml
persistent_data:
  - /var/lib/homecontrol-heartbeat
network_services:
  - name: heartbeat
    address: 192.168.20.26
    port: 6004
authentication:
  required: true
  methods: [heartbeat_hmac]
safety:
  preserve_device_identity: true
  preserve_network_configuration: true
  preserve_operational_state: true
  require_hardware_approval: true
rollback:
  enabled: true
  backup_required: true
updates:
  unattended: false
  reboot_required: false
notes: Conflict currently runs on Orange Pi Zero 2W/Armbian; legacy raspberry_pi/debian inventory tokens remain accepted until the inventory record is reconciled. Registry and HMAC secret are device-specific state and must not be overwritten.
