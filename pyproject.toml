[project]
name = "homecontrol"
version = "0.1.0"
description = "HCM house control system first-pass implementation"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "asyncpg>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "smbus2>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.26,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
