name: HomeControl CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '06_ACM/**'
      - '12_tests/test_acm*.py'
      - '.github/workflows/acm-ci.yml'
  pull_request:
    paths-ignore:
      - '06_ACM/**'
      - '12_tests/test_acm*.py'
      - '.github/workflows/acm-ci.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: homecontrol_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HCM_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/homecontrol_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Test
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q 00_Heartbeat 01_HCM 02_SIM 03_LCM 04_RCM 05_PNL 07_config 08_servises 11_scripts 12_tests
      - name: Diff check
        run: git diff --check
      - name: Active configuration safety checks
        run: |
          ! grep -RInE '192\.168\.60|CAN_250KBPS|250000' 02_SIM 04_RCM 07_config/02_SIM 07_config/04_RCM 07_config/06_RMC
      - name: JavaScript syntax
        run: |
          node --check 01_HCM/www/app.js
          npm ci --prefix 08_servises/matter_bridge --ignore-scripts
          npm run check --prefix 08_servises/matter_bridge
          HCM_MATTER_VALIDATE_ONLY=true HCM_MATTER_STORAGE="$RUNNER_TEMP/hcm-matter" HCM_MATTER_PASSCODE=20202021 node 08_servises/matter_bridge/bridge.mjs
      - name: Build and verify HCM deployment image (no GPIO or app lifespan)
        run: |
          docker build --build-arg HCM_GIT_SHA="$GITHUB_SHA" -f 07_config/01_HCM/Dockerfile.live -t hcm-ci .
          docker run --rm --network none hcm-ci python 11_scripts/hcm_verify.py --expected-sha "$GITHUB_SHA"
