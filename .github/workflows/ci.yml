name: HomeControl CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Test
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q 00_Heartbeat 01_HCM 02_SIM 03_LCM 04_RCM 05_PNL 06_config 07_servises 10_scripts 11_tests
      - name: Diff check
        run: git diff --check
      - name: Active configuration safety checks
        run: |
          ! grep -RInE '192\.168\.60|CAN_250KBPS|250000' 02_SIM 04_RCM 06_config/02_SIM 06_config/04_RCM 06_config/06_RMC
      - name: JavaScript syntax
        run: node --check 01_HCM/www/app.js
      - name: Build and verify HCM deployment image (no GPIO or app lifespan)
        run: |
          docker build --build-arg HCM_GIT_SHA="$GITHUB_SHA" -f 06_config/01_HCM/Dockerfile.live -t hcm-ci .
          docker run --rm --network none hcm-ci python 10_scripts/hcm_verify.py --expected-sha "$GITHUB_SHA"
