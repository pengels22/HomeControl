<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeControl</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">HC</span>
        <div>
          <h1>HomeControl</h1>
          <p>HCM admin</p>
        </div>
      </div>
      <nav class="nav" aria-label="Main navigation">
        <a href="/dashboard" data-route="dashboard">Dashboard</a>
        <a href="/devices-services" data-route="devices-services">Devices &amp; Services</a>
        <a href="/automations" data-route="automations">Automations</a>
        <a href="/helpers" data-route="helpers">Helpers</a>
        <a href="/settings" data-route="settings">Settings</a>
        <a href="/users" data-route="users">Users</a>
      </nav>
      <button id="logout" class="ghost" hidden>Log out</button>
    </aside>

    <section class="workspace">
      <section id="login-view" class="login-card">
        <div>
          <h2>Sign In</h2>
          <p>Use an HCM account to continue.</p>
        </div>
        <label>Username <input id="username" autocomplete="username"></label>
        <label>Password <input id="password" type="password" autocomplete="current-password"></label>
        <button id="login">Sign in</button>
        <p id="login-error" class="error"></p>
      </section>

      <section id="app-view" hidden>
        <div id="preview-banner" class="preview-banner" hidden>
          Development preview: simulated fixture data only. No production HCM, database, Jetson, LAB1, Conflict, or module hardware is connected.
        </div>
        <header class="page-head">
          <div>
            <p id="page-kicker">HCM</p>
            <h2 id="page-title">Dashboard</h2>
          </div>
          <button id="refresh-page" class="secondary">Refresh</button>
        </header>
        <p id="app-error" class="error"></p>
        <section id="content" class="content" aria-live="polite"></section>
      </section>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
