services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: homecontrol
      POSTGRES_USER: homecontrol
      POSTGRES_PASSWORD: homecontrol-dev
    ports:
      - "5432:5432"
    volumes:
      - hcm_pg:/var/lib/postgresql/data
      - ./08_database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  hcm_pg:
