services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: homecontrol
      POSTGRES_USER: homecontrol
      POSTGRES_PASSWORD: homecontrol-dev
    ports:
      # Development-only PostgreSQL; never expose the database on the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - hcm_pg:/var/lib/postgresql/data
      - ./09_database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  hcm_pg:
