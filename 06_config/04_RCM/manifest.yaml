schema_version: 1
device_type: RCM
package: 04_RCM
hardware:
  supported_platforms: [orange_pi, raspberry_pi]
  supported_os: [debian, ubuntu]
  architectures: [aarch64]
runtime:
  type: python
  python: ">=3.11"
deployment:
  adapter: linux_systemd
  install: install.sh
  update: update.sh
  verify: verify.sh
  rollback: rollback.sh
  actions: [install, update, verify, rollback]
services:
  - homecontrol-module@04_RCM.service
  - homecontrol-update.service
configuration_files:
  - rcm.yaml
  - hardware_pins.yaml
  - global_config_RCM.py
persistent_data:
  - /opt/HomeControl/runtime
authentication:
  required: true
  methods: [mtls_hcm, heartbeat_hmac]
safety:
  preserve_device_identity: true
  preserve_network_configuration: true
  preserve_operational_state: true
  require_hardware_approval: true
rollback:
  enabled: true
  backup_required: true
updates:
  unattended: false
  reboot_required: false
