config_version: 1
hcm_host: 192.168.20.27
hcm_port: 6501
heartbeat_seconds: 5
heartbeat_v3:
  socket_path: /run/hcm-heartbeat/control.sock
  watchdog_name: rcm_app
  status_name: rcm_app
software_version: 0.1.0
identity:
  source: designated_physical_interface_mac
  normalized: lowercase_no_colons
  example: 48b02d87db16
networks:
  control_vlan: 20
  production_control_vlan: 40
  heartbeat_vlan: 60
  heartbeat_conflict_address: 192.168.60.2
  heartbeat_port: 6004
  note: VLAN 60 is reserved for Unified Heartbeat V3 supervisory traffic only.
io:
  mode: auto
tls:
  enabled: false
capabilities: [relay-32]
identity_path: ./runtime/rcm_identity.json
fail_actions: {}
web:
  enabled: true
  host: 0.0.0.0
  port: 8094
  hcm_api_url: http://192.168.20.27:8080/api/v1
