config_version: 1
hardware_profile: hardware_pins.yaml
network:
  control:
    active_profile: development_control
    profiles:
      development_control:
        vlan: 20
        subnet: 192.168.20.0/24
        hcm_address: 192.168.20.27
        assignment_enabled: true
        pools:
          RCM: {start: 192.168.20.20, end: 192.168.20.29}
          LCM: {start: 192.168.20.30, end: 192.168.20.39}
          SIM: {start: 192.168.20.40, end: 192.168.20.49}
          PNL: {start: 192.168.20.50, end: 192.168.20.89}
        note: Current development/control network. Do not migrate running devices automatically.
      production_control:
        vlan: 40
        subnet: null
        hcm_address: null
        assignment_enabled: false
        require_explicit_subnet: true
        pools:
          RCM: null
          LCM: null
          SIM: null
          PNL: null
        note: Production control subnet and pools require explicit approval before assignment.
  heartbeat_supervisory:
    vlan: 20
    conflict_manager_address: 192.168.20.26
    port: 6004
    implementation: 00_Heartbeat Unified Heartbeat V3
    note: Current development deployment uses the VLAN 20 Ethernet path; the VLAN 60 migration is not active.
  vlan140:
    applicable: false
services:
  module_tcp_port: 6501
  update_port: 6503
  ntp: local
safety:
  fire_input:
    mode: physical
    debounce_ms: 250
    alarm_level: high
    documented_contact_arrangement: "NO to 3.3V, Common to GPIO, NC to Ground"
  emergency_lighting_logical_names: []
  hvac_shutdown_logical_names: []
  heartbeat_socket_path: /run/hcm-heartbeat/control.sock
hvac:
  global_setpoint_f: 70
  deadband_f: 1
  damper_lead_ms: 500
  fan_lead_ms: 500
  fan_postrun_seconds: 60
  cool_min_run_seconds: 120
  heat_min_run_seconds: 60
  cool_restart_lockout_seconds: 300
  heat_restart_lockout_seconds: 300
