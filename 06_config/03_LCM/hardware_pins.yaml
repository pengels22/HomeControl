  "9": {function: GND, verification: UNVERIFIED, exclusive: false}
  "10": {function: SHELLY_RELAY_IN2, soc: PH3, verification: UNVERIFIED}
  "11": {function: LCD_DC, soc: PC6, verification: VALIDATED_TRAVEL_LASER_REFERENCE}
