  "20": {function: GND, verification: UNVERIFIED, exclusive: false}
  "21": {function: SPI1_MISO_RESERVED, soc: PH8, verification: UNVERIFIED}
  "22": {function: AVAILABLE, soc: PC7, verification: UNVERIFIED}
  "23": {function: SPI1_CLK, soc: PH6, verification: UNVERIFIED}
  "24": {function: SPI1_CS1_LCD, soc: PH9, verification: VALIDATED_TRAVEL_LASER_REFERENCE}
