config_version: 1
hardware_profile: hardware_pins.yaml
hcm_host: 192.168.20.27
hcm_port: 6501
heartbeat_seconds: 5
heartbeat_v3:
  socket_path: /run/hcm-heartbeat/control.sock
  watchdog_name: lcm_app
  status_name: lcm_app
software_version: 0.1.0
identity:
  source: designated_physical_interface_mac
  normalized: lowercase_no_colons
  example: 48b02d87db16
networks:
  control_vlan: 20
  production_control_vlan: 40
  heartbeat_vlan: 20
  heartbeat_conflict_address: 192.168.20.26
  heartbeat_port: 6004
  note: Current development deployment uses the VLAN 20 Ethernet path.
safety:
  emergency_lighting_channels: []
  hvac_shutdown_channels: []
io:
  mode: auto
tls:
  enabled: false
capabilities: [relay-8, analog-out-10, hv-dimmer-4, lighting]
identity_path: ./runtime/lcm_identity.json
analog_outputs: [10-1,10-2,10-3,10-4,10-5,10-6,10-7,10-8]
web:
  enabled: true
  host: 0.0.0.0
  port: 8093
  hcm_api_url: http://192.168.20.27:8080/api/v1
i2c:
  enabled: false
  bus: 3
  voltage_domain: 5V_HV_SIDE
  level_shifter: required
  pwm_controller: {model: PCA9685, address: 0x40, frequency_hz: 1000, real_output_enabled: false}
  analog_channels: [10-1, 10-2, 10-3, 10-4, 10-5, 10-6, 10-7, 10-8, 10-9, 10-10]
  reserved_pwm_channels: [10, 11, 12, 13, 14, 15]
