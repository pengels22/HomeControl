config_version: 1
hcm_host: 192.168.60.1
hcm_port: 6501
heartbeat_seconds: 5
software_version: 0.1.0
io:
  mode: auto
tls:
  enabled: false
capabilities: [rmc-can, telemetry, faults, hexa-aio, hexa-dio, hexa-usb, hexa-can, hexa-12v-switching]
rmc_firmware_updates:
  enabled: true
  staging_root: /var/lib/hcm/firmware-staging
  compatible_hardware: [RMC-NANO-ATMEGA328P]
  can_protocol:
    transport: classical-can
    block_size_bytes: 4
    strategy: stop-and-wait
    max_retries_per_block: 3
    timeouts_s:
      enter_bootloader_ack: 3
      bootloader_ready: 8
      block_ack: 2
      verify: 10
      application_return: 20
hexa_board:
  model: ViaGasaFamido 6-channel CAN hub / Hexa board
  role: SIM field IO and CAN distribution
  interfaces:
    aio:
      enabled: true
      ads1115:
        - name: ads_ai_1
          address: "0x48"
          role: Analog inputs A1-A4
        - name: ads_ai_2
          address: "0x49"
          role: Analog inputs A5-A8
        - name: ads_loop_monitor
          address: "0x4A"
          role: 12V loop monitors
      bus_monitors:
        bus_3v3:
          label: 3.3V bus monitor
          source: onboard ADC1
          unit: V
          nominal_v: 3.3
          off_below_v: 1.0
          warning_low_v: 3.1
          warning_high_v: 3.5
          simulated_v: 3.31
        bus_5v:
          label: 5V bus monitor
          source: onboard ADC2
          unit: V
          nominal_v: 5.0
          off_below_v: 1.0
          warning_low_v: 4.75
          warning_high_v: 5.25
          simulated_v: 5.02
      loop_monitors:
        loop_a:
          label: Loop A 12V monitor
          source: ADS 0x4A CH0
          unit: V
          nominal_v: 12.0
          off_below_v: 3.0
          warning_low_v: 11.0
          warning_high_v: 13.2
          simulated_v: 12.1
        loop_b:
          label: Loop B 12V monitor
          source: ADS 0x4A CH1
          unit: V
          nominal_v: 12.0
          off_below_v: 3.0
          warning_low_v: 11.0
          warning_high_v: 13.2
          simulated_v: 12.0
        loop_c:
          label: Loop C 12V monitor
          source: ADS 0x4A CH2
          unit: V
          nominal_v: 12.0
          off_below_v: 3.0
          warning_low_v: 11.0
          warning_high_v: 13.2
          simulated_v: 0.0
        loop_d:
          label: Loop D spare
          source: ADS 0x4A CH3
          unit: V
          visible: false
          nominal_v: 12.0
          off_below_v: 3.0
          warning_low_v: 11.0
          warning_high_v: 13.2
          simulated_v: 0.0
      analog_inputs:
        a1: {label: A1, source: ADS 0x48 CH0, unit: V, simulated_v: 0.00}
        a2: {label: A2, source: ADS 0x48 CH1, unit: V, simulated_v: 0.00}
        a3: {label: A3, source: ADS 0x48 CH2, unit: V, simulated_v: 0.00}
        a4: {label: A4, source: ADS 0x48 CH3, unit: V, simulated_v: 0.00}
        a5: {label: A5, source: ADS 0x49 CH0, unit: V, simulated_v: 0.00}
        a6: {label: A6, source: ADS 0x49 CH1, unit: V, simulated_v: 0.00}
        a7: {label: A7, source: ADS 0x49 CH2, unit: V, simulated_v: 0.00}
        a8: {label: A8, source: ADS 0x49 CH3, unit: V, simulated_v: 0.00}
    dio:
      enabled: true
      channels:
        dio1: {label: Digital IO 1, direction: input, simulated: false}
        dio2: {label: Digital IO 2, direction: input, simulated: false}
        dio3: {label: Digital IO 3, direction: output, simulated: false}
        dio4: {label: Digital IO 4, direction: output, simulated: false}
    usb:
      enabled: true
      ports:
        usb1: {label: OPI3 host link, expected: connected}
        usb2: {label: UCAN loop B, expected: connected}
        usb3: {label: UCAN loop C, expected: connected}
    switching_12v:
      enabled: true
      outputs:
        sw1: {label: Loop A power, simulated: false}
        sw2: {label: Loop B power, simulated: false}
        sw3: {label: Loop C power, simulated: false}
rmc_sensor_stack:
  aht21:
    label: AHT21 temperature/humidity
    interface: i2c
    address: "0x38"
    telemetry: [temperature_c, humidity_pct]
  ens160:
    label: ENS160 air quality
    interface: i2c
    address: "0x52"
    telemetry: [aqi]
  bh1750:
    label: BH1750 ambient light
    interface: i2c
    address: "0x23"
    telemetry: [lux]
  rcwl_0516:
    label: RCWL-0516 presence
    interface: gpio
    pin: D3
    telemetry: [presence]
  mcp2515_tja1050:
    label: MCP2515 + TJA1050 CAN interface
    interface: spi
    cs_pin: D10
    int_pin: D2
    telemetry: [can]
identity_path: ./runtime/sim_identity.json
web:
  enabled: true
  host: 0.0.0.0
  port: 8092
  hcm_api_url: http://192.168.60.1:8080/api/v1
can_enabled: true
can_bitrate: 125000
can_kernel_modules: [can, can_raw, gs_usb]
can_interfaces:
  - name: can0
    label: CAN A
    hardware: FYSETC Hexa CAN0
    driver: gs_usb
    connector: Hexa Port 1
    bitrate: 125000
    enabled: true
  - name: can1
    label: CAN B
    hardware: UCAN1
    driver: gs_usb
    connector: Hexa Port 2
    bitrate: 125000
    enabled: true
  - name: can2
    label: CAN C
    hardware: UCAN2
    driver: gs_usb
    connector: Hexa Port 3
    bitrate: 125000
    enabled: true
