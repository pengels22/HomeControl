config_version: 1
hcm_host: 192.168.60.1
hcm_port: 6501
heartbeat_seconds: 5
software_version: 0.1.0
io:
  mode: auto
tls:
  enabled: false
capabilities: [rmc-can, telemetry, faults]
rmc_sensor_stack:
  aht21:
    label: AHT21 temperature/humidity
    interface: i2c
    address: "0x38"
    telemetry: [temperature_c, humidity_pct]
  ens160:
    label: ENS160 air quality
    interface: i2c
    address: "0x52"
    telemetry: [aqi]
  bh1750:
    label: BH1750 ambient light
    interface: i2c
    address: "0x23"
    telemetry: [lux]
  rcwl_0516:
    label: RCWL-0516 presence
    interface: gpio
    pin: D3
    telemetry: [presence]
  mcp2515_tja1050:
    label: MCP2515 + TJA1050 CAN interface
    interface: spi
    cs_pin: D10
    int_pin: D2
    telemetry: [can]
identity_path: ./runtime/sim_identity.json
web:
  enabled: true
  host: 0.0.0.0
  port: 8092
  hcm_api_url: http://192.168.60.1:8080/api/v1
can_enabled: true
can_bitrate: 125000
can_kernel_modules: [can, can_raw, gs_usb]
can_interfaces:
  - name: can0
    label: CAN A
    hardware: FYSETC Hexa CAN0
    driver: gs_usb
    connector: Hexa Port 1
    bitrate: 125000
    enabled: true
  - name: can1
    label: CAN B
    hardware: UCAN1
    driver: gs_usb
    connector: Hexa Port 2
    bitrate: 125000
    enabled: true
  - name: can2
    label: CAN C
    hardware: UCAN2
    driver: gs_usb
    connector: Hexa Port 3
    bitrate: 125000
    enabled: true
