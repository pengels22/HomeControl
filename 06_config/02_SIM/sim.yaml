config_version: 1
hcm_host: 192.168.60.1
hcm_port: 6501
heartbeat_seconds: 5
software_version: 0.1.0
io:
  mode: auto
tls:
  enabled: false
capabilities: [rmc-can, telemetry, faults, hexa-aio, hexa-dio, hexa-usb, hexa-can, hexa-24v-switching]
hexa_board:
  model: ViaGasaFamido 6-channel CAN hub / Hexa board
  role: SIM field IO and CAN distribution
  interfaces:
    aio:
      enabled: true
      channels:
        adc1:
          label: 3.3V bus monitor
          source: ADC1
          unit: V
          nominal_v: 3.3
          warning_low_v: 3.1
          warning_high_v: 3.5
          simulated_v: 3.31
        adc2:
          label: 5V bus monitor
          source: ADC2
          unit: V
          nominal_v: 5.0
          warning_low_v: 4.75
          warning_high_v: 5.25
          simulated_v: 5.02
        adc3:
          label: Loop A 12V monitor
          source: ADC3
          unit: V
          nominal_v: 12.0
          warning_low_v: 11.0
          warning_high_v: 13.2
          simulated_v: 12.1
        adc4:
          label: Loop B 12V monitor
          source: ADC4
          unit: V
          nominal_v: 12.0
          warning_low_v: 11.0
          warning_high_v: 13.2
          simulated_v: 12.0
    dio:
      enabled: true
      channels:
        dio1: {label: Digital IO 1, direction: input, simulated: false}
        dio2: {label: Digital IO 2, direction: input, simulated: false}
        dio3: {label: Digital IO 3, direction: output, simulated: false}
        dio4: {label: Digital IO 4, direction: output, simulated: false}
    usb:
      enabled: true
      ports:
        usb1: {label: OPI3 host link, expected: connected}
        usb2: {label: UCAN loop B, expected: connected}
        usb3: {label: UCAN loop C, expected: connected}
    switching_24v:
      enabled: true
      outputs:
        sw1: {label: 24V switched output 1, simulated: false}
        sw2: {label: 24V switched output 2, simulated: false}
rmc_sensor_stack:
  aht21:
    label: AHT21 temperature/humidity
    interface: i2c
    address: "0x38"
    telemetry: [temperature_c, humidity_pct]
  ens160:
    label: ENS160 air quality
    interface: i2c
    address: "0x52"
    telemetry: [aqi]
  bh1750:
    label: BH1750 ambient light
    interface: i2c
    address: "0x23"
    telemetry: [lux]
  rcwl_0516:
    label: RCWL-0516 presence
    interface: gpio
    pin: D3
    telemetry: [presence]
  mcp2515_tja1050:
    label: MCP2515 + TJA1050 CAN interface
    interface: spi
    cs_pin: D10
    int_pin: D2
    telemetry: [can]
identity_path: ./runtime/sim_identity.json
web:
  enabled: true
  host: 0.0.0.0
  port: 8092
  hcm_api_url: http://192.168.60.1:8080/api/v1
can_enabled: true
can_bitrate: 125000
can_kernel_modules: [can, can_raw, gs_usb]
can_interfaces:
  - name: can0
    label: CAN A
    hardware: FYSETC Hexa CAN0
    driver: gs_usb
    connector: Hexa Port 1
    bitrate: 125000
    enabled: true
  - name: can1
    label: CAN B
    hardware: UCAN1
    driver: gs_usb
    connector: Hexa Port 2
    bitrate: 125000
    enabled: true
  - name: can2
    label: CAN C
    hardware: UCAN2
    driver: gs_usb
    connector: Hexa Port 3
    bitrate: 125000
    enabled: true
