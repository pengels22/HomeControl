[platformio]
default_envs = acm, keypad
src_dir = .

[env]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Ethernet @ ^2.0.2
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -I shared
    -std=gnu++17

[env:acm]
build_src_filter = +<acm/*.cpp> +<shared/*.cpp>
build_flags = ${env.build_flags} -DACM_TARGET=1

[env:keypad]
build_src_filter = +<keypad/*.cpp> +<shared/*.cpp>
build_flags = ${env.build_flags} -DKEYPAD_TARGET=1
